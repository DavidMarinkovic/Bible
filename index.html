<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bible — consultation</title>
  <style>
    :root { color-scheme: light; --ink:#112d4e; --muted:#62738a; --paper:#f6f9fc; --line:#cfdae6; --accent:#2864a3; --wash:#e6f0fa; }
    * { box-sizing:border-box; } body { margin:0; font:16px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif; color:var(--ink); background:var(--paper); }
    header { padding:3.5rem max(1.25rem,calc((100% - 980px)/2)); background:linear-gradient(135deg,#dcecfb,#f6f9fc); border-bottom:1px solid var(--line); }
    h1 { margin:0; font:700 clamp(2rem,5vw,3.4rem)/1.05 Georgia,serif; } header p { max-width:46rem; color:var(--muted); margin:.8rem 0 0; }
    main { max-width:980px; margin:0 auto; padding:1.5rem 1.25rem 4rem; } input { width:100%; padding:.85rem 1rem; border:1px solid #aeb8ad; border-radius:.5rem; font:inherit; background:white; }
    nav { display:flex; flex-wrap:wrap; gap:.5rem; margin:1.2rem 0 2rem; } button { cursor:pointer; border:1px solid var(--line); background:white; color:var(--ink); border-radius:999px; padding:.45rem .85rem; font:inherit; } button:hover,button.active { color:white; background:var(--accent); border-color:var(--accent); }
    .status { color:var(--muted); margin:.5rem 0 1rem; } .card { background:white; border:1px solid var(--line); border-radius:.7rem; padding:1.1rem 1.2rem; margin:.8rem 0; box-shadow:0 5px 20px #123b6512; }
    h2 { margin:0; font:700 1.3rem/1.2 Georgia,serif; } .reference { color:var(--accent); font-weight:700; margin:.2rem 0 .6rem; } .theme { display:inline-block; background:var(--wash); border-radius:999px; padding:.1rem .55rem; color:#605745; font-size:.85rem; } .note { color:var(--muted); font-size:.92rem; } .verse { margin:.45rem 0; } .verse b { color:var(--accent); margin-right:.35rem; }
    details { border:1px solid var(--line); border-radius:.6rem; padding:.8rem 1rem; background:white; margin:.7rem 0; } summary { cursor:pointer; font-weight:650; } pre { white-space:pre-wrap; overflow-wrap:anywhere; color:#33453d; font-size:.85rem; }
  </style>
</head>
<body>
  <header><h1>Bible</h1><p>Une consultation simple des lieux, de l'histoire de l'Église, des saints et des passages bibliques.</p></header>
  <main>
    <input id="search" type="search" placeholder="Rechercher un mot, une référence ou un thème…" aria-label="Rechercher">
    <nav id="sections" aria-label="Sections"></nav>
    <p id="status" class="status">Chargement des données…</p>
    <section id="results" aria-live="polite"></section>
  </main>
  <script>
    const state = { data:null, section:'Passages_bibliques_majeurs', query:'' };
    const labels = { Passages_bibliques_majeurs:'Passages bibliques', Lieux:'Lieux', Temporel:'Histoire', Eglise:'Église', Saints:'Saints' };
    const $ = id => document.getElementById(id);
    const esc = value => String(value ?? '').replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
    const textOf = item => JSON.stringify(item).toLocaleLowerCase('fr');

    function renderNav() {
      $('sections').innerHTML = Object.keys(labels).filter(key => state.data[key]).map(key =>
        `<button class="${key === state.section ? 'active' : ''}" data-section="${key}">${labels[key]}</button>`).join('');
      document.querySelectorAll('[data-section]').forEach(button => button.onclick = () => { state.section = button.dataset.section; render(); });
    }
    function passageCard(passage) {
      const verses = (passage.versets || []).map(v => `<p class="verse"><b>${esc(v.numero)}.</b>${esc(v.texte)}</p>`).join('');
      return `<article class="card"><h2>${esc(passage.titre || 'Passage')}</h2><p class="reference">${esc(passage.reference || '')}</p>${passage.extrait ? `<p>${esc(passage.extrait)}</p>` : ''}${verses}${passage.theme ? `<span class="theme">${esc(passage.theme)}</span>` : ''}${passage.note ? `<p class="note">${esc(passage.note)}</p>` : ''}</article>`;
    }
    function render() {
      const value = state.data[state.section]; const q = state.query.trim().toLocaleLowerCase('fr');
      renderNav();
      if (state.section === 'Passages_bibliques_majeurs') {
        const passages = (value.passages || []).filter(p => !q || textOf(p).includes(q));
        $('status').textContent = `${passages.length} passage${passages.length > 1 ? 's' : ''}${q ? ' trouvé' + (passages.length > 1 ? 's' : '') : ''}.`;
        $('results').innerHTML = passages.map(passageCard).join('') || '<p>Aucun passage ne correspond à cette recherche.</p>';
      } else {
        const items = Array.isArray(value) ? value : Object.entries(value).map(([titre, contenu]) => ({ titre, contenu }));
        const shown = items.filter(item => !q || textOf(item).includes(q));
        $('status').textContent = `${shown.length} élément${shown.length > 1 ? 's' : ''} dans ${labels[state.section]}.`;
        $('results').innerHTML = shown.map(item => `<details><summary>${esc(item.titre || item.nom || item.date || 'Élément')}</summary><pre>${esc(JSON.stringify(item, null, 2))}</pre></details>`).join('') || '<p>Aucun résultat.</p>';
      }
    }
    $('search').addEventListener('input', event => { state.query = event.target.value; render(); });
    fetch('./bible.json').then(response => { if (!response.ok) throw new Error(response.status); return response.json(); }).then(data => { state.data = data; render(); }).catch(() => { $('status').textContent = 'Impossible de charger bible.json. Publiez ces deux fichiers ensemble sur un hébergement Web.'; });
  </script>

<style>
  nav { position:sticky; top:0; z-index:20; padding:.8rem 0; background:linear-gradient(90deg,#f4f8fd 80%,#f4f8fdcc); border-bottom:1px solid var(--line); }
</style>
<script>
  function humanize(key) { return String(key).replaceAll('_', ' ').replace(/\b\w/g, letter => letter.toLocaleUpperCase('fr')); }
</script>
<style>
  .place-card { display:block; width:100%; padding:0; overflow:hidden; text-align:left; border-radius:1rem; background:white; }
  .place-card img { width:100%; height:140px; object-fit:cover; display:block; filter:saturate(.75) contrast(1.05); }
  .place-card .place-copy { display:block; padding:1rem; color:var(--ink); }
  .place-card .place-copy small { display:block; color:var(--muted); margin-top:.25rem; }
  .breadcrumb { display:flex; align-items:center; gap:.7rem; margin:0 0 1rem; color:var(--muted); }
  .back { border-radius:.5rem; padding:.4rem .7rem; background:#e2eef9; color:#174d7e; border-color:#b6d2eb; }
  .region { margin:1.4rem 0; padding:1.2rem; border:1px solid var(--line); border-radius:1rem; background:#fff; }
  .region h2 { color:var(--accent); margin-bottom:.2rem; }
  .city { margin-top:.85rem; padding:1rem; border-left:3px solid #76aee0; background:#f5f9fd; border-radius:0 .7rem .7rem 0; }
  .city h3 { margin:0; font-size:1.2rem; color:var(--ink); }
  .people { display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:.6rem; margin-top:.8rem; }
  .person { padding:.75rem; background:white; border:1px solid #d5e1ec; border-radius:.6rem; }
  .person strong { display:block; color:#164d7f; }
  .person span { display:block; margin-top:.2rem; font-size:.88rem; color:var(--muted); }
</style>
<script>
  state.placeIndex = null;
  const placeImage = country => blueArt.carte;
  const refText = refs => (refs || []).map(ref => `${ref.livre} ${ref.chapitre}:${ref.versets}`).join(' · ');
  function personHtml(person) { return `<div class="person"><strong>${esc(person.nom)}</strong><span>${esc(refText(person.references))}</span>${person.note ? `<span>${esc(person.note)}</span>` : ''}</div>`; }
  function cityHtml(city) {
    const name = city.ville?.nom || 'Ville'; const modern = city.ville?.hypotheses_modernes || city.ville?.noms_modernes || [];
    return `<article class="city"><h3>${esc(name)}</h3>${modern.length ? `<p class="note">${esc(modern.join(' · '))}</p>` : ''}<div class="people">${(city.personnages_bibliques || []).map(personHtml).join('') || '<span class="note">Aucun personnage explicitement associé.</span>'}</div></article>`;
  }
  function renderPlaces() {
    const places = state.data.Lieux;
    if (state.placeIndex === null) {
      $('status').textContent = `${places.length} pays et territoires. Choisissez un lieu pour voir ses régions, villes et personnages.`;
      $('results').className = 'record-grid';
      $('results').innerHTML = places.map((place, index) => { const country = place.pays.nom; const cities = place.regions.reduce((sum, region) => sum + region.villes.length, 0); return `<button class="place-card" data-place="${index}"><img src="${placeImage(country)}" alt="Carte des lieux bibliques"><span class="place-copy"><strong>${esc(country)}</strong><small>${cities} ville${cities > 1 ? 's' : ''} · ${(place.personnages_bibliques || []).length} personnage${(place.personnages_bibliques || []).length > 1 ? 's' : ''} au niveau du pays</small></span></button>`; }).join('');
      document.querySelectorAll('[data-place]').forEach(button => button.onclick = () => { state.placeIndex = Number(button.dataset.place); render(); });
      return;
    }
    const place = places[state.placeIndex], country = place.pays.nom;
    $('status').textContent = '';
    $('results').className = '';
    $('results').innerHTML = `<div class="breadcrumb"><button class="back" id="back-places">← Tous les lieux</button><span>${esc(country)}</span></div><article class="card"><img class="portrait" style="width:155px;height:110px" src="${placeImage(country)}" alt="Carte des lieux bibliques"><h2>${esc(country)}</h2><p class="note">${esc((place.pays.noms_modernes || []).join(' · '))}</p>${(place.personnages_bibliques || []).length ? `<div class="people">${place.personnages_bibliques.map(personHtml).join('')}</div>` : ''}</article>${place.regions.map(region => `<section class="region"><h2>${esc(region.region.nom)}</h2><p class="note">${esc((Array.isArray(region.region.noms_modernes) ? region.region.noms_modernes : [region.region.noms_modernes]).filter(Boolean).join(' · '))}</p>${(region.personnages_bibliques || []).length ? `<div class="people">${region.personnages_bibliques.map(personHtml).join('')}</div>` : ''}${region.villes.map(cityHtml).join('')}</section>`).join('')}`;
    $('back-places').onclick = () => { state.placeIndex = null; render(); };
  }
  const renderWithoutPlaces = render;
  render = function() { if (state.section === 'Lieux') { renderNav(); renderPlaces(); } else { state.placeIndex = null; renderWithoutPlaces(); } };
</script>
</body>
</html>
